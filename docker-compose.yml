services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bio-frappe:latest
    container_name: bio-frappe-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ROLE: app
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-bio_frappe}"
      DB_USERNAME: "${DB_USERNAME:-bio_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      FRAPPE_HR_URL: "${FRAPPE_HR_URL:-https://hrm.secumaxtech.com}"
      FRAPPE_HR_API_KEY: "${FRAPPE_HR_API_KEY}"
      FRAPPE_HR_API_SECRET: "${FRAPPE_HR_API_SECRET}"
    volumes:
      - .:/var/www/html
      - bio-frappe-vendor:/var/www/html/vendor
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - bio-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: bio-frappe:latest
    container_name: bio-frappe-worker
    restart: unless-stopped
    environment:
      APP_ROLE: worker
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-bio_frappe}"
      DB_USERNAME: "${DB_USERNAME:-bio_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      FRAPPE_HR_URL: "${FRAPPE_HR_URL:-https://hrm.secumaxtech.com}"
      FRAPPE_HR_API_KEY: "${FRAPPE_HR_API_KEY}"
      FRAPPE_HR_API_SECRET: "${FRAPPE_HR_API_SECRET}"
    volumes:
      - .:/var/www/html
      - bio-frappe-vendor:/var/www/html/vendor
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - bio-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: bio-frappe:latest
    container_name: bio-frappe-scheduler
    restart: unless-stopped
    environment:
      APP_ROLE: scheduler
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-bio_frappe}"
      DB_USERNAME: "${DB_USERNAME:-bio_user}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      QUEUE_CONNECTION: database
      FRAPPE_HR_URL: "${FRAPPE_HR_URL:-https://hrm.secumaxtech.com}"
      FRAPPE_HR_API_KEY: "${FRAPPE_HR_API_KEY}"
      FRAPPE_HR_API_SECRET: "${FRAPPE_HR_API_SECRET}"
    volumes:
      - .:/var/www/html
      - bio-frappe-vendor:/var/www/html/vendor
    depends_on:
      pgsql:
        condition: service_healthy
    networks:
      - bio-network

  pgsql:
    image: postgres:15-alpine
    container_name: bio-frappe-postgres
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-bio_frappe}"
      POSTGRES_USER: "${DB_USERNAME:-bio_user}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - bio-frappe-pgsql:/var/lib/postgresql/data
    networks:
      - bio-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bio_user} -d ${DB_DATABASE:-bio_frappe}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  bio-network:
    driver: bridge

volumes:
  bio-frappe-pgsql:
    driver: local
  bio-frappe-vendor:
    driver: local
