services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DB_HOST: pgsql
            DB_PORT: 5432
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            DEVICE_GATEWAY_URL: 'http://adms-gateway:8081'
            DEVICE_GATEWAY_TOKEN: '${DEVICE_GATEWAY_TOKEN}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
            - adms-gateway
    queue:
        image: 'sail-8.5/app'
        command: php artisan queue:work database --sleep=1 --tries=3 --timeout=180
        restart: unless-stopped
        environment:
            DB_HOST: pgsql
            DB_PORT: 5432
            DEVICE_GATEWAY_URL: 'http://adms-gateway:8081'
            DEVICE_GATEWAY_TOKEN: '${DEVICE_GATEWAY_TOKEN}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            adms-gateway:
                condition: service_started
    scheduler:
        image: 'sail-8.5/app'
        command: php artisan schedule:work
        restart: unless-stopped
        environment:
            DB_HOST: pgsql
            DB_PORT: 5432
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
    adms-gateway:
        build:
            context: ./gateway
            dockerfile: Dockerfile
        environment:
            ADMS_MANAGEMENT_TOKEN: '${DEVICE_GATEWAY_TOKEN}'
            LARAVEL_INTERNAL_URL: 'http://laravel.test'
            LARAVEL_GATEWAY_TOKEN: '${LARAVEL_GATEWAY_TOKEN}'
            ADMS_STORE_PATH: '/var/lib/bio-notifier-adms/gateway.db'
            ADMS_TRUSTED_PROXY_CIDRS: '${ADMS_TRUSTED_PROXY_CIDRS:-}'
        ports:
            - '${ADMS_PORT:-8080}:8080'
        volumes:
            - 'adms-gateway-data:/var/lib/bio-notifier-adms'
        networks:
            - sail
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    adms-gateway-data:
        driver: local
